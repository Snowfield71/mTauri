[package]
name = "mtauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.5.1", features = ["unstable"] }
serde_json = "1.0"
urlencoding = "2.1.2"
tauri-plugin-opener = "2.2.6"
tauri-plugin-store = "2.3.0"
